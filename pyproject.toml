[project]
name = "manywidgets-playground"
version = "0.1.0"
description = "Author and publish kernel-free interactive manywidgets notebooks to GitHub Pages."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # 0.2.0a1 = first PyPI release with the Fullscreen widget + MapCompare.
    "manywidgets[lonboard,numpy]>=0.2.0a1",
    "geopandas>=1.0",        # lonboard seed notebook
    "pyarrow>=16",           # geopandas -> arrow
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "mystmd>=1.3",           # pure-uv MyST CLI (bundles node)
    "python-dotenv>=1.0",    # secrets in notebooks
    "openpyxl>=3.1.5",
    "requests>=2.34.2",
    "matplotlib>=3.11.1",
    "rasterio>=1.5.0",
    "rio-cogeo>=7.0.2",
    "rasterstats>=0.21.0",
    "pystac-client>=0.8",    # Montandon STAC API (monty_* + situation-room notebooks)
    "duckdb>=1.1",           # Overture S3 GeoParquet queries (la-fires, city-explorer)
    "osmnx>=2.0",            # OSM walk network + amenities (city-explorer)
    "h3>=4.0",               # H3 hex grid (city-explorer)
    "scipy>=1.14",           # osmnx nearest_nodes needs a KDTree
    "scikit-learn>=1.5",     # osmnx nearest_nodes (unprojected graph BallTree)
    "wigglystuff>=0.5",     # third-party anywidgets (wigglystuff interop notebook)
]

[tool.uv]
package = false              # this repo is an app, not a distributable wheel
